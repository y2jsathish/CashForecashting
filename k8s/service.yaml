apiVersion: v1
kind: Service
metadata:
  name: atmcash-web
  namespace: atm-cash-forecasting
spec:
  type: ClusterIP
  selector:
    app: atmcash-web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atmcash-web-ingress
  namespace: atm-cash-forecasting
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - atmcash.bank.example
      secretName: atmcash-tls
  rules:
    - host: atmcash.bank.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atmcash-web
                port:
                  number: 80
