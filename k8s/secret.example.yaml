# Example only — do NOT commit real secrets. In production, source these from Azure Key Vault
# via the Secrets Store CSI Driver instead of a plain Kubernetes Secret.
apiVersion: v1
kind: Secret
metadata:
  name: atmcash-web-secrets
  namespace: atm-cash-forecasting
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Server=tcp:<azure-sql-server>.database.windows.net,1433;Database=AtmCashForecasting;Authentication=Active Directory Managed Identity;TrustServerCertificate=False"
  Jwt__SigningKey: "REPLACE_WITH_32_PLUS_CHAR_SECRET"
  Seed__AdminUserName: "admin@bank.example"
  Seed__AdminPassword: "REPLACE_ME"
