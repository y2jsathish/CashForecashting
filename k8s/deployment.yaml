apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmcash-web
  namespace: atm-cash-forecasting
  labels:
    app: atmcash-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: atmcash-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: atmcash-web
    spec:
      containers:
        - name: atmcash-web
          image: atmcashacr.azurecr.io/atmcash-web:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: atmcash-web-config
            - secretRef:
                name: atmcash-web-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atmcash-web-hpa
  namespace: atm-cash-forecasting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atmcash-web
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
